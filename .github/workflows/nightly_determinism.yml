name: Nightly Determinism

# AN11-F (LOW) audit scope clarification:
#
# **What this workflow actually verifies**: same-run determinism — running
# `lake exe sele4n` twice in the same job produces byte-identical trace
# output (`tests/artifacts/nightly/sele4n_run1.trace` ≡ `…/sele4n_run2.trace`).
# The diff is captured at `…/sele4n_determinism.diff` and uploaded.
#
# **What it does NOT verify**: cross-commit determinism (today's trace
# matching yesterday's trace).  That stronger check would require either
# downloading the previous run's artifacts via `actions/download-artifact`
# or maintaining a fixture inside the repo.  Implemented today as the
# `tests/fixtures/main_trace_smoke.expected` fixture (gated by Tier 2)
# which runs on every PR — so cross-commit determinism IS gated, just
# not in this nightly job.

on:
  schedule:
    - cron: '22 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-tier4:
    name: Tiered Tests / Nightly (Tier 0-4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Lean and Lake caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          # AN11-F (LOW): job-tagged cache key (nightly lane).  Falls back
          # to the full lane's cache when the nightly key misses.
          key: ${{ runner.os }}-${{ runner.arch }}-lean-nightly-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'scripts/setup_lean_env.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lean-nightly-
            ${{ runner.os }}-${{ runner.arch }}-lean-full-
            ${{ runner.os }}-${{ runner.arch }}-lean-

      - name: Setup Lean toolchain
        run: ./scripts/setup_lean_env.sh

      # Every tier-4 gate is a QEMU boot check, and a gate that cannot run
      # certifies nothing.  setup_lean_env.sh installs the emulator too, but
      # it does so in the background (test deps are non-blocking there), so
      # install it synchronously here: the tier must not start racing the
      # package manager and then record its gates as NOT RUN.
      - name: Install QEMU (tier-4 SMP acceptance gates)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          qemu-system-aarch64 --version

      # Tier 4 reports NOT RUN (exit 77) when its acceptance gates cannot
      # execute, and that status propagates to here.  Today every QEMU gate
      # skips for want of a bootable kernel image, which SM10.E.D1 owes and
      # which no amount of CI configuration can supply — so a hard failure
      # would paint this job red on every scheduled run until that phase
      # lands, and a signal that is always red is one nobody reads.
      #
      # Incomplete coverage is therefore surfaced as a warning annotation and
      # in the run summary, never as a silent pass: the tier's own output
      # already names each gate that did not run.  `SELE4N_REQUIRE_GATES=1`
      # remains the mode that fails outright, and the v1.0.0 release
      # validation (SM10.E) must run in it.
      - name: Run nightly gate with deterministic replay candidates
        env:
          NIGHTLY_ENABLE_EXPERIMENTAL: '1'
        run: |
          set +e
          ./scripts/ci_capture_timing.sh nightly ./scripts/test_nightly.sh
          rc=$?
          set -e
          if [[ "${rc}" -eq 77 ]]; then
            echo "::warning title=Tier-4 coverage incomplete::One or more acceptance gates did not run (no bootable kernel image; owed by SM10.E.D1). This is tracked, not a pass — see the tier output for the gates that were skipped."
            {
              echo "### Tier-4 acceptance gates: NOT RUN"
              echo
              echo "The nightly completed, but one or more Tier-4 acceptance gates could not"
              echo "execute. Coverage is incomplete; this is **not** a clean run."
              echo
              echo "Cause: no bootable kernel image (\`SELE4N_KERNEL_IMAGE\`), owed by SM10.E.D1."
              echo "Re-run with \`SELE4N_REQUIRE_GATES=1\` to treat a skipped gate as a failure."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          exit "${rc}"

      - name: Collect nightly smoke flake telemetry (default 3 attempts)
        run: ./scripts/ci_flake_probe.sh nightly-smoke-repeat ./scripts/test_smoke.sh

      - name: Upload nightly trace artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-trace-artifacts
          path: tests/artifacts/nightly/

      - name: Upload nightly CI telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-telemetry-nightly
          path: .ci-artifacts/telemetry/
          if-no-files-found: ignore
