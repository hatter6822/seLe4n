[workspace]
resolver = "2"
members = [
    "sele4n-types",
    "sele4n-abi",
    "sele4n-sys",
    "sele4n-hal",
]

[workspace.package]
# Version tracks the Lean lakefile.toml version (currently 0.36.3)
version = "0.36.3"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/hatter6822/seLe4n"
# MSRV — minimum supported Rust version.  Must be kept in lockstep with:
#   - `rust/rust-toolchain.toml` (`channel`)
#   - `.github/workflows/lean_action_ci.yml` (`toolchain:` field of the
#     `dtolnay/rust-toolchain` step in the `Rust ABI Tests` job)
#   - `scripts/setup_lean_env.sh` (`RUST_TOOLCHAIN_VERSION` variable)
rust-version = "1.94"

# `panic = "abort"` is required for `no_std` kernel builds — the
# default `panic = "unwind"` is UB across `extern "C"` boundaries and
# requires a landing-pad implementation not present in the bare-metal
# HAL. With abort, a panic calls `halt()` and stops the kernel, which
# is the correct behavior for invariant violations.
#
# Test profile intentionally omits `panic = "abort"`: Rust's stable test
# harness requires unwind to drive `#[should_panic]` (e.g., the MMIO
# alignment assertions in `sele4n-hal/src/mmio.rs`).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# The v0.36.2 audit: the board runs this profile, and a silent wrap is the one
# arithmetic outcome a microkernel must not have.  Every size and count that
# takes untrusted input is already `checked_*` / `saturating_*`; this makes the
# residue — an implicit `+` on a value some earlier check bounded — a halt
# (the panic handler is the system barrier) rather than a wrapped value, at
# the cost of a compare-and-branch per operation.  The dev profile, which
# every host test runs under, has always had it on.
overflow-checks = true
