# Pin the Rust toolchain for the seLe4n project.
#
# This file is read automatically by `rustup` whenever any `cargo`/`rustc`/
# `clippy`/`rustfmt` command runs from this directory (or any descendant).
# `rustup` will:
#   - Install the specified toolchain on first use if not present.
#   - Use the specified toolchain regardless of the system default.
#
# This matches the `dtolnay/rust-toolchain@1.94.1` pin in
# `.github/workflows/lean_action_ci.yml` so local `cargo test` matches the
# CI environment exactly.  Without this file, a developer on a newer Rust
# version could write code that depends on features stabilised after the
# pin and have it silently pass local tests but fail CI — as happened on
# PR #777.
#
# The pin cuts BOTH ways, and the second direction is easy to overlook: a
# stale pin also freezes `clippy`, so lints added upstream since the pin
# never run against this codebase.  A developer whose *default* toolchain
# is newer sees warnings the gate does not, and "fixing" them can break
# the pinned build outright — `clippy::manual_is_multiple_of` suggests
# `u64::is_multiple_of`, stabilised in 1.87, which 1.82 rejects as an
# unstable feature.  Keep this pin current with stable rather than
# letting it drift.
#
# When bumping MSRV, update **all three** sites in lockstep:
#   1. `channel` below (this file)
#   2. `[workspace.package].rust-version` in `Cargo.toml`
#   3. `toolchain:` in `.github/workflows/lean_action_ci.yml`
#      (the `dtolnay/rust-toolchain` step in the `Rust ABI Tests` job)
# Plus the `RUST_TOOLCHAIN_VERSION` documentation variable in
# `scripts/setup_lean_env.sh:49`.

[toolchain]
channel = "1.94.1"
components = ["clippy", "rustfmt"]
# WS-RR RR1.1: the bare-metal cross target the kernel HAL is actually
# built for.  Listing it here means `rustup` installs `rust-std` for it
# on first use from `rust/`, so `cargo build --target
# aarch64-unknown-none -p sele4n-hal --features hw_target` works on a
# fresh clone without a separate `rustup target add` step.
#
# The directory override is what makes this load-bearing: `rustup` reads
# this file only for commands run from `rust/` or a descendant.  A
# `cargo --manifest-path rust/.../Cargo.toml` invoked from the repository
# root silently selects the *default* toolchain, which has neither this
# pin nor this target — the aarch64 build then fails with "can't find
# crate for `core`" that looks like a source problem rather than a
# working-directory one.  Always `cd rust/` first.
targets = ["aarch64-unknown-none"]
profile = "minimal"
